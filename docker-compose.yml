# 企业级部署：一键拉起后端 + 前端（可选，需先安装 Docker Desktop）
# 启动：docker compose up --build
# 说明：当前后端用 SQLite + Chroma 持久化到卷；如需 PostgreSQL/Redis 可在此基础上扩展。

services:
  backend:
    build: ./backend
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-langchain-rag-bishe-secret-2026}
      - DATABASE_URL=sqlite:////data/rag.db
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - HF_HOME=/data/hf_cache
    volumes:
      - rag_data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  rag_data:
